<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Python Editor</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="container">
            <div class="header">
                <img
                    src="python-logo.svg"
                    alt="Python logo of two snakes"
                    height="29px"
                />
                <button id="run-button" class="button button-disabled" disabled>
                    Loading...
                </button>
            </div>

            <div class="content" id="grid-container">
                <div class="editor-panel">
                    <div id="editor" style="height: 100%"></div>
                </div>

                <div class="output-panel">
                    <div class="resize-handle" id="resize-handle"></div>
                    <div
                        class="resize-handle-vertical"
                        id="resize-handle-vertical"
                        style="display: none"
                    ></div>
                    <div class="output-content">
                        <div id="output">
                            <pre class="output-text" id="output-text">
Loading...</pre
                            >
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script type="module">
            import { EditorView, basicSetup } from "https://esm.sh/codemirror";
            import { autocompletion } from "https://esm.sh/@codemirror/autocomplete";
            import {
                lineNumbers,
                keymap,
            } from "https://esm.sh/@codemirror/view";
            import {
                indentOnInput,
                indentUnit,
            } from "https://esm.sh/@codemirror/language";
            import { indentWithTab } from "https://esm.sh/@codemirror/commands";
            import { python } from "https://esm.sh/@codemirror/lang-python";
            import { githubLight } from "https://esm.sh/@uiw/codemirror-theme-github";

            const runButton = document.getElementById("run-button");
            const outputElement = document.getElementById("output");
            const outputText = document.getElementById("output-text");

            function getDecodedIdFromHash() {
                const hash = window.location.hash.substring(1);

                if (!hash) return "";

                const encodedId = hash.split("=")[1];

                if (!encodedId) return "";

                try {
                    return decodeUrlSafeBase64(encodedId);
                } catch (e) {
                    console.error("Failed to decode:", e);
                    return "# Failed to decode";
                }
            }

            function decodeUrlSafeBase64(str) {
                str = str.replace(/-/g, "+").replace(/_/g, "/");
                while (str.length % 4) str += "=";
                const bytes = Uint8Array.from(atob(str), (c) =>
                    c.charCodeAt(0),
                );
                return new TextDecoder().decode(bytes);
            }

            const initial_code = getDecodedIdFromHash();

            let pyodideReady = false;
            let isRunning = false;
            let worker;

            function updateButton() {
                if (isRunning) {
                    runButton.textContent = "Running...";
                    runButton.disabled = true;
                    runButton.className = "button button-disabled";
                } else if (pyodideReady) {
                    runButton.textContent = "▶ Run Code";
                    runButton.disabled = false;
                    runButton.className = "button button-enabled";
                } else {
                    runButton.textContent = "Loading...";
                    runButton.disabled = true;
                    runButton.className = "button button-disabled";
                }
            }

            // Clear all output (text, plots, errors) except the base outputText element
            function clearOutput() {
                while (outputElement.lastChild !== outputText) {
                    outputElement.removeChild(outputElement.lastChild);
                }
                outputText.textContent = "";
            }

            function runCode() {
                if (!worker || !pyodideReady || isRunning) return;
                isRunning = true;
                updateButton();
                clearOutput();
                outputText.textContent = "Running...";
                const code = editor.state.doc.toString();
                worker.postMessage({ type: "run", code });
            }

            runButton.addEventListener("click", runCode);

            const editor = new EditorView({
                doc: initial_code,
                extensions: [
                    keymap.of([
                        {
                            key: "Shift-Enter",
                            run: () => {
                                runCode();
                                return true;
                            },
                        },
                        indentWithTab,
                    ]),
                    basicSetup,
                    python(),
                    autocompletion(),
                    githubLight,
                    indentOnInput(),
                    indentUnit.of("    "),
                    lineNumbers({
                        formatNumber: (lineNo) =>
                            String(lineNo).padStart(1, " "),
                    }),
                ],
                parent: document.getElementById("editor"),
            });

            const params = new URLSearchParams(document.location.search);
            const loadMicropip = params.get("micropip") == "1" ? true : false;
            const libs = params.getAll("lib");

            const workerSettings = {
                loadMicropip,
                libs,
            };

            worker = new Worker("./pyodide-worker.js", {
                type: "module",
            });

            worker.postMessage({
                type: "init",
                settings: workerSettings,
            });

            worker.onmessage = (event) => {
                const { type, kind, content, error } = event.data;

                switch (type) {
                    case "ready":
                        pyodideReady = true;
                        updateButton();
                        outputText.textContent = "Ready to run Python";
                        break;

                    case "output":
                        // First output clears the "Running..." text
                        if (outputText.textContent === "Running...") {
                            outputText.textContent = "";
                        }

                        if (kind === "text" || kind === "error") {
                            // Append to the last <pre> if it's the same kind, otherwise create new
                            const last = outputElement.lastElementChild;
                            const cls =
                                kind === "error"
                                    ? "output-text output-error"
                                    : "output-text";
                            if (
                                last &&
                                last.tagName === "PRE" &&
                                last.className === cls
                            ) {
                                last.textContent += content;
                            } else {
                                const pre = document.createElement("pre");
                                pre.className = cls;
                                pre.textContent = content;
                                outputElement.appendChild(pre);
                            }
                        } else if (kind === "image") {
                            const wrapper = document.createElement("div");
                            wrapper.className = "plot-output";
                            const img = document.createElement("img");
                            img.src = "data:image/png;base64," + content;
                            img.alt = "matplotlib plot";
                            wrapper.appendChild(img);
                            outputElement.appendChild(wrapper);
                        }
                        break;

                    case "done":
                        // If no output was posted at all, show a default message
                        if (outputText.textContent === "Running...") {
                            outputText.textContent =
                                "Code executed successfully (no output)";
                        }
                        isRunning = false;
                        updateButton();
                        break;

                    case "error":
                        if (outputText.textContent === "Running...") {
                            outputText.textContent = "";
                        }
                        const errPre = document.createElement("pre");
                        errPre.className = "output-text output-error";
                        errPre.textContent = `Error: ${error}`;
                        outputElement.appendChild(errPre);
                        isRunning = false;
                        updateButton();
                        break;
                }
            };

            worker.onerror = (error) => {
                outputText.textContent = `Worker error: ${
                    error.message || "Unknown error"
                }`;
                pyodideReady = false;
                isRunning = false;
                updateButton();
            };
        </script>

        <script>
        const container = document.getElementById("grid-container");
        const handle = document.getElementById("resize-handle");
        const handleVertical = document.getElementById(
            "resize-handle-vertical",
        );

        const MOBILE_BREAKPOINT = 768;
        const MIN_PANEL = 100; // smallest a panel can be dragged to, in px (0 = can fully collapse)

        // Store the split as a fraction of the container, not as pixels,
        // so it scales automatically when the window changes size.
        let colRatio = 0.5; // desktop: editor width / container width
        let rowRatio = 0.6; // mobile: editor height / container height
        let isResizing = false;
        let isMobile = window.innerWidth < MOBILE_BREAKPOINT;

        const clamp = (v, min, max) => Math.min(Math.max(v, min), max);

        function updateGrid() {
            isMobile = window.innerWidth < MOBILE_BREAKPOINT;
            if (isMobile) {
                container.style.gridTemplateColumns = "minmax(0, 1fr)";
                container.style.gridTemplateRows = `minmax(0, ${rowRatio * 100}%) minmax(0, 1fr)`;
                handle.style.display = "none";
                handleVertical.style.display = "block";
            } else {
                container.style.gridTemplateColumns = `minmax(0, ${colRatio * 100}%) minmax(0, 1fr)`;
                container.style.gridTemplateRows = "minmax(0, 1fr)";
                handle.style.display = "block";
                handleVertical.style.display = "none";
            }
        }

        function startResize(e) {
            isResizing = true;
            e.currentTarget.setPointerCapture(e.pointerId);
            document.body.style.userSelect = "none";
            document.body.style.cursor = isMobile ? "row-resize" : "col-resize";
            e.preventDefault();
        }

        function stopResize() {
            if (!isResizing) return;
            isResizing = false;
            document.body.style.userSelect = "";
            document.body.style.cursor = "";
        }

        // Pointer events cover mouse, touch and pen
        handle.addEventListener("pointerdown", (e) => {
            if (!isMobile) startResize(e);
        });

        handleVertical.addEventListener("pointerdown", (e) => {
            if (isMobile) startResize(e);
        });

        document.addEventListener("pointermove", (e) => {
            if (!isResizing) return;

            const rect = container.getBoundingClientRect();

            if (isMobile) {
                const min = Math.min(MIN_PANEL, rect.height / 2);
                const h = clamp(e.clientY - rect.top, min, rect.height - min);
                rowRatio = h / rect.height;
            } else {
                const min = Math.min(MIN_PANEL, rect.width / 2);
                const w = clamp(e.clientX - rect.left, min, rect.width - min);
                colRatio = w / rect.width;
            }
            updateGrid();
        });

        document.addEventListener("pointerup", stopResize);
        document.addEventListener("pointercancel", stopResize);

        window.addEventListener("resize", updateGrid);

        updateGrid();
        </script>
    </body>
</html>
